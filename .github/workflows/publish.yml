name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          compatibility_version=$(node -p "require('./compat/code-intel/package.json').version")
          compatibility_target=$(node -p "require('./compat/code-intel/package.json').dependencies['@team-harness/code-deep']")
          test "$RELEASE_TAG" = "v$package_version"
          test "$compatibility_version" = "$package_version"
          test "$compatibility_target" = "$package_version"
      - name: Publish code-deep to npm
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          published_version=$(npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
          if [ "$published_version" = "$package_version" ]; then
            echo "$package_name@$package_version is already published; skipping npm publish."
          else
            npm publish
          fi
      - name: Publish code-intel compatibility package to npm
        run: |
          package_name=$(node -p "require('./compat/code-intel/package.json').name")
          package_version=$(node -p "require('./compat/code-intel/package.json').version")
          published_version=$(npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
          if [ "$published_version" = "$package_version" ]; then
            echo "$package_name@$package_version is already published; skipping npm publish."
          else
            npm publish ./compat/code-intel
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub Release; skipping creation."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
