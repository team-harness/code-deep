name: Verify package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package-smoke:
    name: Node 24 package smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install tarball
        run: |
          package_file=$(npm pack --silent)
          smoke_dir=$(mktemp -d)
          (cd "$smoke_dir" && npm init --yes >/dev/null)
          npm install --prefix "$smoke_dir" "./$package_file"
          (cd "$smoke_dir" && node --input-type=module -e "import('@team-harness/code-deep').then(({CodeDeepClient}) => { if (typeof CodeDeepClient !== 'function') process.exit(1); })")
          "$smoke_dir/node_modules/.bin/code-deep" --help
          test -x "$smoke_dir/node_modules/.bin/code-deep"
          compatibility_package=$(npm pack ./compat/code-intel --silent)
          compatibility_tarball="$GITHUB_WORKSPACE/$compatibility_package"
          tar -xOf "$compatibility_tarball" package/package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => { const value = JSON.parse(input); if (value.bin['code-deep'] !== 'cli.js' || value.dependencies['@team-harness/code-deep'] !== require('./package.json').version) process.exit(1); })"
          npm install --prefix "$smoke_dir" "$compatibility_tarball"
          "$smoke_dir/node_modules/.bin/code-deep" --version
          test ! -e "$smoke_dir/node_modules/.bin/code-intel"
